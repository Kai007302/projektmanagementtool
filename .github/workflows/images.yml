name: Images

# Prebuilt production images in GitHub Container Registry for installations that do not build on the server
# (Portainer, docker-compose.portainer.yml, ADR 0019):
#   ghcr.io/<owner>/projecthub-api, projecthub-web, projecthub-caddy
# Tags: "latest" and "main" for main, "sha-<short commit>" for every build, "1.2.3" and "1.2" for a tag v1.2.3.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: projecthub-api
            context: .
            file: src/ProjectHub.Api/Dockerfile
          - name: projecthub-web
            context: src/ProjectHub.Web
            file: src/ProjectHub.Web/Dockerfile
          - name: projecthub-caddy
            context: deploy
            file: deploy/caddy.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Never the end-to-end test identity in a published image (src/identity/devUser.ts).
          build-args: VITE_DEV_IDENTITY=false
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
